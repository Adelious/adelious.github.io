<!DOCTYPE html>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: {
            50: '#eef2ff',
            100: '#e0e7ff',
            500: '#6366f1',
            600: '#4f46e5',

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body, {delimiters: [{left:'$$', right:'$$', display:true},{left:'$',right:'$',display:false}]});"></script>
</head>

</button>

              </svg>
            </div>

          <svg class="w-4 h-4 text-gray-400 group-hover:text-gray-600 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">

  <!-- Main Content -->
  <main class="flex-1 lg:ml-0 p-4 lg:p-8">
    <!-- Cours Content -->
    <section id="cours-content" class="hidden">
      <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-2xl shadow-lg border border-gray-200 overflow-hidden">
          <div class="bg-gradient-to-r from-blue-600 to-blue-700 px-8 py-6">
            <h2 class="text-2xl font-bold text-white">Cours de Mathématiques</h2>
            <p class="text-blue-100 mt-2">Apprenez les concepts fondamentaux</p>
          </div>
          <div class="p-8">
            <div id="cours-content-body" class="prose prose-lg max-w-none text-gray-700">
              <!-- Contenu dynamique -->
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Concret Content -->
    <section id="concret-content" class="hidden">
      <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-2xl shadow-lg border border-gray-200 overflow-hidden">
          <div class="bg-gradient-to-r from-green-600 to-green-700 px-8 py-6">
            <h2 class="text-2xl font-bold text-white">Outils Mathématiques</h2>
            <p class="text-green-100 mt-2">Calculez et visualisez vos expressions</p>
          </div>
          
          <div class="p-8">
            <form id="form-concret" class="space-y-6">
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Expression mathématique</label>
                <div class="relative">
                  <input id="expr" type="text" placeholder="Ex: sin(x)^2 + cos(x)^2"
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all duration-200 text-lg"/>
                  <div class="absolute right-3 top-3">
                    <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                    </svg>
                  </div>
                </div>
              </div>

              <div id="extra-params" class="hidden">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Valeur de x</label>
                <input id="xvalue" type="number" value="1" step="any"
                  class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all duration-200"/>
              </div>

              <button type="button" id="btn-run"
                class="w-full bg-gradient-to-r from-primary-600 to-primary-700 text-white py-4 px-6 rounded-xl hover:from-primary-700 hover:to-primary-800 transition-all duration-200 font-semibold text-lg shadow-lg hover:shadow-xl transform hover:-translate-y-1">
                <div class="flex items-center justify-center space-x-2">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                  </svg>
                  <span>Exécuter</span>
                </div>
              </button>
            </form>

            <!-- Results -->
            <div id="result" class="mt-8 p-6 bg-gray-50 rounded-xl border border-gray-200 min-h-[100px] hidden">
              <div class="prose max-w-none text-gray-700">
                <!-- Résultat dynamique -->
              </div>
            </div>

            <!-- Evaluation Tree -->
            <div id="evaluation-tree" class="mt-6 p-6 bg-blue-50 rounded-xl border border-blue-200 hidden">
              <div class="flex items-center space-x-2 mb-4">
                <div class="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center">
                  <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
                  </svg>
                </div>
                <h3 class="font-semibold text-blue-800">Arbre d'évaluation</h3>
              </div>
              <div id="eval-tree-content" class="font-mono text-sm text-blue-700 bg-white p-4 rounded-lg border border-blue-200 overflow-x-auto"></div>
            </div>

            <!-- Remainder Tree -->
            <div id="remainder-tree" class="mt-6 p-6 bg-amber-50 rounded-xl border border-amber-200 hidden">
              <div class="flex items-center space-x-2 mb-4">
                <div class="w-8 h-8 bg-amber-100 rounded-lg flex items-center justify-center">
                  <svg class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.871 4A17.926 17.926 0 003 12c0 2.874.673 5.59 1.871 8m14.13 0a17.926 17.926 0 001.87-8c0-2.874-.673-5.59-1.87-8M9 9h1.246a1 1 0 01.961.725l1.586 5.55a1 1 0 00.961.725H15m1-7h-.08a2 2 0 00-1.519.698L9.6 15.302A2 2 0 018.08 16H8"></path>
                  </svg>
                </div>
                <h3 class="font-semibold text-amber-800">Expression symbolique</h3>
              </div>
              <div id="rem-tree-content" class="font-mono text-sm text-amber-700 bg-white p-4 rounded-lg border border-amber-200 overflow-x-auto"></div>
            </div>

            <!-- Chart -->
            <div id="chart-wrapper" class="mt-8 p-6 bg-gray-50 rounded-xl border border-gray-200 hidden">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-semibold text-gray-800">Graphique de la fonction</h3>
                <div class="flex items-center space-x-2 text-sm text-gray-600">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                  </svg>
                  <span>Domaine: [-10, 10]</span>
                </div>
              </div>
              <div class="bg-white p-4 rounded-lg border border-gray-200">
                <canvas id="plot" height="300"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/mathjs@14.5.2/lib/browser/math.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer-prime@1.2.5/all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
<script>
  // Mobile menu functionality
  const mobileMenuBtn = document.getElementById('mobile-menu-btn');
  const sidebar = document.getElementById('sidebar');
  const mobileOverlay = document.getElementById('mobile-overlay');
  const closeSidebar = document.getElementById('close-sidebar');

  mobileMenuBtn.addEventListener('click', () => {
    sidebar.classList.remove('-translate-x-full');
    mobileOverlay.classList.remove('hidden');
  });

  closeSidebar.addEventListener('click', () => {
    sidebar.classList.add('-translate-x-full');
    mobileOverlay.classList.add('hidden');
  });

  mobileOverlay.addEventListener('click', () => {
    sidebar.classList.add('-translate-x-full');
    mobileOverlay.classList.add('hidden');
  });

  // Données cours
  const coursData = {
    intro: `
      <h1 class="text-3xl font-bold text-gray-900 mb-6">Introduction aux Mathématiques</h1>
      <p class="text-lg text-gray-700 mb-6">Bienvenue dans cet outil mathématique interactif. Explorez les concepts fondamentaux et utilisez nos outils pratiques pour vos calculs.</p>
      <div class="bg-blue-50 border border-blue-200 rounded-lg p-6 mb-6">
        <h3 class="font-semibold text-blue-800 mb-3">Identité trigonométrique fondamentale</h3>
        <p class="text-blue-700">L'une des identités les plus importantes en trigonométrie :</p>
        <div class="mt-3">$$\\sin^2(x) + \\cos^2(x) = 1$$</div>
      </div>
      <p class="text-gray-600">Cette identité est à la base de nombreux calculs trigonométriques et sera utilisée dans nos exemples.</p>
    `,
    derive: `
      <h1 class="text-3xl font-bold text-gray-900 mb-6">Dérivation</h1>
      <p class="text-lg text-gray-700 mb-6">La dérivation est l'opération qui permet de calculer le taux de variation instantané d'une fonction.</p>
      <div class="bg-green-50 border border-green-200 rounded-lg p-6 mb-6">
        <h3 class="font-semibold text-green-800 mb-3">Notation</h3>
        <p class="text-green-700">La dérivée de $f(x)$ par rapport à $x$ peut être notée de plusieurs façons :</p>
        <div class="mt-3">$$f'(x) = \\frac{df}{dx} = \\frac{d}{dx}f(x)$$</div>
      </div>
      <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-6 mb-6">
        <h3 class="font-semibold text-yellow-800 mb-3">Exemple classique</h3>
        <p class="text-yellow-700">Dérivée de la fonction sinus :</p>
        <div class="mt-3">$$\\frac{d}{dx} \\sin(x) = \\cos(x)$$</div>
      </div>
      <p class="text-gray-600">Utilisez notre outil de dérivation pour calculer automatiquement la dérivée de vos expressions.</p>
    `,
    integrale: `
      <h1 class="text-3xl font-bold text-gray-900 mb-6">Intégration</h1>
      <p class="text-lg text-gray-700 mb-6">L'intégration est l'opération inverse de la dérivation. Elle permet de calculer l'aire sous une courbe.</p>
      <div class="bg-purple-50 border border-purple-200 rounded-lg p-6 mb-6">
        <h3 class="font-semibold text-purple-800 mb-3">Définition</h3>
        <p class="text-purple-700">L'intégrale indéfinie de $f(x)$ est une fonction $F(x)$ telle que :</p>
        <div class="mt-3">$$F'(x) = f(x)$$</div>
      </div>
      <div class="bg-indigo-50 border border-indigo-200 rounded-lg p-6 mb-6">
        <h3 class="font-semibold text-indigo-800 mb-3">Exemple</h3>
        <p class="text-indigo-700">Intégrale de la fonction cosinus :</p>
        <div class="mt-3">$$\\int \\cos(x) \\, dx = \\sin(x) + C$$</div>
        <p class="text-indigo-600 text-sm mt-2">où $C$ est la constante d'intégration</p>
      </div>
      <p class="text-gray-600">Notre outil d'intégration vous permet de calculer les primitives de vos fonctions.</p>
    `
  };

  // Références DOM
  const coursContent = document.getElementById('cours-content');
  const coursContentBody = document.getElementById('cours-content-body');
  const concretContent = document.getElementById('concret-content');
  const resultBox = document.getElementById('result');
  const exprInput = document.getElementById('expr');
  const xValueInput = document.getElementById('xvalue');
  const extraParamsDiv = document.getElementById('extra-params');
  const btnRun = document.getElementById('btn-run');
  const chartWrapper = document.getElementById('chart-wrapper');
  const chartCanvas = document.getElementById('plot');
  let chartInstance = null;

  // Variables d'état
  let currentSection = null;
  let currentId = null;
  let activeButton = null;

  // Fonction pour mettre à jour l'état visuel des boutons
  function updateActiveButton(button) {
    // Réinitialiser tous les boutons
    document.querySelectorAll('.cours-item, .concret-item').forEach(btn => {
      btn.classList.remove('bg-blue-100', 'text-blue-700', 'border-blue-500', 'bg-green-100', 'text-green-700', 'border-green-500');
      btn.classList.add('text-gray-600', 'border-transparent');
    });

    // Activer le bouton sélectionné
    if (button) {
      const section = button.dataset.section;
      if (section === 'cours') {
        button.classList.remove('text-gray-600', 'border-transparent');
        button.classList.add('bg-blue-100', 'text-blue-700', 'border-blue-500');
      } else {
        button.classList.remove('text-gray-600', 'border-transparent');
        button.classList.add('bg-green-100', 'text-green-700', 'border-green-500');
      }
    }
  }

  // Gestion des clics dans la sidebar
  document.querySelectorAll('button[data-section]').forEach(btn => {
    btn.addEventListener('click', () => {
      const section = btn.dataset.section;
      const id = btn.dataset.id;

      if(currentSection !== section || currentId !== id) {
        currentSection = section;
        currentId = id;
        updateActiveButton(btn);

        // Fermer la sidebar mobile après sélection
        if (window.innerWidth < 1024) {
          sidebar.classList.add('-translate-x-full');
          mobileOverlay.classList.add('hidden');
        }

        if(section === 'cours') {
          concretContent.classList.add('hidden');
          coursContent.classList.remove('hidden');
          coursContentBody.innerHTML = coursData[id] || '<p>Contenu non trouvé.</p>';
          renderMathInElement(coursContentBody);
        } else {
          coursContent.classList.add('hidden');
          concretContent.classList.remove('hidden');
          resetForm();
          setupForm(id);
        }
      }
    });
  });

  // Setup formulaire selon concret id
  function setupForm(id) {
    resultBox.classList.add('hidden');
    resultBox.innerHTML = '';
    chartWrapper.classList.add('hidden');
    extraParamsDiv.classList.add('hidden');
    document.getElementById('evaluation-tree').classList.add('hidden');
    document.getElementById('remainder-tree').classList.add('hidden');
    
    btnRun.innerHTML = '<div class="flex items-center justify-center space-x-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg><span>Exécuter</span></div>';

    // Afficher certains paramètres selon id
    if(id === 'evaluate') {
      extraParamsDiv.classList.remove('hidden');
    }

    // Changer le texte du bouton selon l'action
    if(id === 'plot') {
      btnRun.innerHTML = '<div class="flex items-center justify-center space-x-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg><span>Tracer</span></div>';
    } else if(id === 'simplify') {
      btnRun.innerHTML = '<div class="flex items-center justify-center space-x-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.871 4A17.926 17.926 0 003 12c0 2.874.673 5.59 1.871 8m14.13 0a17.926 17.926 0 001.87-8c0-2.874-.673-5.59-1.87-8M9 9h1.246a1 1 0 01.961.725l1.586 5.55a1 1 0 00.961.725H15m1-7h-.08a2 2 0 00-1.519.698L9.6 15.302A2 2 0 018.08 16H8"></path></svg><span>Simplifier</span></div>';
    } else if(id === 'derive') {
      btnRun.innerHTML = '<div class="flex items-center justify-center space-x-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg><span>Dériver</span></div>';
    } else if(id === 'integrate') {
      btnRun.innerHTML = '<div class="flex items-center justify-center space-x-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg><span>Intégrer</span></div>';
    } else if(id === 'evaluate') {
      btnRun.innerHTML = '<div class="flex items-center justify-center space-x-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg><span>Calculer</span></div>';
    }
  }

  // Reset formulaire
  function resetForm() {
    exprInput.value = '';
    xValueInput.value = '1';
    resultBox.classList.add('hidden');
    resultBox.innerHTML = '';
    chartWrapper.classList.add('hidden');
    document.getElementById('evaluation-tree').classList.add('hidden');
    document.getElementById('remainder-tree').classList.add('hidden');
    if(chartInstance) {
      chartInstance.destroy();
      chartInstance = null;
    }
  }

  // Fonction pour afficher les résultats
  function showResult(content) {
    resultBox.innerHTML = content;
    resultBox.classList.remove('hidden');
  }

  btnRun.addEventListener('click', () => {
    if(!currentSection || !currentId) return;
    if(currentSection !== 'concret') return;

    const expr = exprInput.value.trim();
    if(!expr) {
      showResult('<div class="flex items-center space-x-2 text-red-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path></svg><span>Veuillez saisir une expression mathématique.</span></div>');
      return;
    }

    // Réinitialiser les arbres
    document.getElementById('evaluation-tree').classList.add('hidden');
    document.getElementById('remainder-tree').classList.add('hidden');

    switch(currentId) {
      case 'evaluate': {
        const xVal = parseFloat(xValueInput.value);
        try {
          const nerdExpr = nerdamer(expr);
          const evalExpr = nerdExpr.evaluate({x: xVal});
          const evalTex = evalExpr.toTeX();
          const remainderTex = nerdExpr.simplify().toTeX();

          showResult(`
            <div class="space-y-4">
              <div class="flex items-center space-x-2 text-green-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span class="font-semibold">Résultat calculé avec succès</span>
              </div>
              <div class="bg-white p-4 rounded-lg border border-gray-200">
                <p class="text-gray-700">Pour <strong>x = ${xVal}</strong> :</p>
                <p class="text-2xl font-bold text-primary-600 mt-2">${evalExpr.text()}</p>
              </div>
            </div>
          `);

          document.getElementById('eval-tree-content').innerHTML = `$${evalTex}$`;
          document.getElementById('evaluation-tree').classList.remove('hidden');
          document.getElementById('rem-tree-content').innerHTML = `$${remainderTex}$`;
          document.getElementById('remainder-tree').classList.remove('hidden');

          renderMathInElement(document.getElementById('evaluation-tree'));
          renderMathInElement(document.getElementById('remainder-tree'));
        } catch(e) {
          showResult(`
            <div class="flex items-center space-x-2 text-red-600">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <span><strong>Erreur :</strong> ${e.message}</span>
            </div>
          `);
        }
        chartWrapper.classList.add('hidden');
        break;
      }

      case 'simplify': {
        try {
          const res = nerdamer.simplify(expr).toTeX();
          showResult(`
            <div class="space-y-4">
              <div class="flex items-center space-x-2 text-green-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span class="font-semibold">Expression simplifiée</span>
              </div>
              <div class="bg-white p-6 rounded-lg border border-gray-200 text-center">
                <div class="text-2xl">$${res}$</div>
              </div>
            </div>
          `);
          renderMathInElement(resultBox);
        } catch(e) {
          showResult(`
            <div class="flex items-center space-x-2 text-red-600">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <span><strong>Erreur :</strong> ${e.message}</span>
            </div>
          `);
        }
        chartWrapper.classList.add('hidden');
        break;
      }

      case 'derive': {
        try {
          const res = nerdamer.diff(expr, 'x').toTeX();
          showResult(`
            <div class="space-y-4">
              <div class="flex items-center space-x-2 text-green-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span class="font-semibold">Dérivée calculée</span>
              </div>
              <div class="bg-white p-6 rounded-lg border border-gray-200 text-center">
                <p class="text-gray-600 mb-3">$\\frac{d}{dx}\\left(${nerdamer(expr).toTeX()}\\right) =$</p>
                <div class="text-2xl text-primary-600">$${res}$</div>
              </div>
            </div>
          `);
          renderMathInElement(resultBox);
        } catch(e) {
          showResult(`
            <div class="flex items-center space-x-2 text-red-600">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <span><strong>Erreur :</strong> ${e.message}</span>
            </div>
          `);
        }
        chartWrapper.classList.add('hidden');
        break;
      }

      case 'integrate': {
        try {
          const res = nerdamer.integrate(expr, 'x').toTeX();
          showResult(`
            <div class="space-y-4">
              <div class="flex items-center space-x-2 text-green-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span class="font-semibold">Intégrale calculée</span>
              </div>
              <div class="bg-white p-6 rounded-lg border border-gray-200 text-center">
                <p class="text-gray-600 mb-3">$\\int ${nerdamer(expr).toTeX()} \\, dx =$</p>
                <div class="text-2xl text-primary-600">$${res} + C$</div>
                <p class="text-sm text-gray-500 mt-3">où C est la constante d'intégration</p>
              </div>
            </div>
          `);
          renderMathInElement(resultBox);
        } catch(e) {
          showResult(`
            <div class="flex items-center space-x-2 text-red-600">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <span><strong>Erreur :</strong> ${e.message}</span>
            </div>
          `);
        }
        chartWrapper.classList.add('hidden');
        break;
      }

      case 'plot': {
        try {
          const compiled = math.compile(expr);
          const xs = [];
          const ys = [];
          for(let x = -10; x <= 10; x += 0.1) {
            let y;
            try { y = compiled.evaluate({x}); } catch { y = NaN; }
            xs.push(x);
            ys.push(Number.isFinite(y) ? y : null);
          }
          
          if(chartInstance) chartInstance.destroy();
          
          chartInstance = new Chart(chartCanvas, {
            type: 'line',
            data: {
              labels: xs.map(x => x.toFixed(1)),
              datasets: [{
                label: `y = ${expr}`,
                data: ys,
                borderColor: 'rgb(99, 102, 241)',
                backgroundColor: 'rgba(99, 102, 241, 0.1)',
                borderWidth: 2,
                pointRadius: 0,
                tension: 0.1,
                fill: false
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  display: true,
                  position: 'top',
                  labels: {
                    usePointStyle: true,
                    font: {
                      size: 14
                    }
                  }
                }
              },
              scales: {
                x: {
                  title: {
                    display: true,
                    text: 'x',
                    font: {
                      size: 14,
                      weight: 'bold'
                    }
                  },
                  grid: {
                    color: 'rgba(0, 0, 0, 0.1)'
                  }
                },
                y: {
                  title: {
                    display: true,
                    text: 'y',
                    font: {
                      size: 14,
                      weight: 'bold'
                    }
                  },
                  grid: {
                    color: 'rgba(0, 0, 0, 0.1)'
                  }
                }
              },
              interaction: {
                intersect: false,
                mode: 'index'
              }
            }
          });
          
          chartWrapper.classList.remove('hidden');
          showResult(`
            <div class="flex items-center space-x-2 text-green-600">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <span class="font-semibold">Graphique généré avec succès</span>
            </div>
          `);
        } catch(e) {
          showResult(`
            <div class="flex items-center space-x-2 text-red-600">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <span><strong>Erreur :</strong> ${e.message}</span>
            </div>
          `);
          chartWrapper.classList.add('hidden');
        }
        break;
      }

      default:
        showResult('');
        chartWrapper.classList.add('hidden');
    }
  });

  // Sélectionner par défaut la première section
  document.querySelector('button[data-section="cours"][data-id="intro"]').click();
</script>
